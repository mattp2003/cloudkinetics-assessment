<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudKinetics Support</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f9;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── header ──────────────────────────────────────────────── */
    header {
      width: 100%;
      background: linear-gradient(135deg, #1a56db 0%, #1648c0 100%);
      color: #fff;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      flex-shrink: 0;
    }
    .header-icon {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .header-text h1  { font-size: 1rem; font-weight: 600; }
    .header-text p   { font-size: .72rem; opacity: .75; margin-top: 1px; }
    .header-status {
      margin-left: auto; display: flex; align-items: center; gap: 7px;
    }
    #status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #ef4444; flex-shrink: 0;
      transition: background .3s;
      box-shadow: 0 0 0 2px rgba(255,255,255,.3);
    }
    #status-dot.connected  { background: #22c55e; }
    #status-dot.connecting { background: #f59e0b; }
    #status-label { font-size: .78rem; opacity: .85; }

    /* ── main container ──────────────────────────────────────── */
    .container {
      width: 100%; max-width: 780px;
      flex: 1; display: flex; flex-direction: column;
      padding: 16px 16px 12px;
      gap: 10px;
      overflow: hidden;
    }

    /* ── connection bar ──────────────────────────────────────── */
    .conn-bar {
      display: flex; gap: 8px; align-items: center;
      background: #fff; padding: 10px 12px;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .conn-bar label { font-size: .75rem; color: #6b7280; white-space: nowrap; }
    .conn-bar input {
      flex: 1; padding: 6px 10px; border: 1px solid #e5e7eb;
      border-radius: 7px; font-size: .82rem; background: #f9fafb;
      outline: none; color: #374151; min-width: 0;
    }
    .conn-bar input:focus { border-color: #1a56db; background: #fff; }
    .btn {
      padding: 7px 15px; border: none; border-radius: 7px;
      font-size: .82rem; font-weight: 500; cursor: pointer;
      transition: opacity .15s, background .15s, transform .1s;
      white-space: nowrap; flex-shrink: 0;
    }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: #1a56db; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1648c0; }
    .btn-danger  { background: #ef4444; color: #fff; }
    .btn-danger:hover:not(:disabled)  { background: #dc2626; }

    /* ── disconnect banner ───────────────────────────────────── */
    #disconnect-banner {
      display: none; background: #fef2f2; border: 1px solid #fca5a5;
      border-radius: 8px; padding: 8px 14px;
      font-size: .82rem; color: #b91c1c; text-align: center;
    }
    #disconnect-banner.visible { display: block; }

    /* ── chat area ───────────────────────────────────────────── */
    #chat {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
      gap: 14px; padding: 4px 2px 4px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 9px; }

    /* ── message rows ────────────────────────────────────────── */
    .bubble-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .bubble-row.user  { flex-direction: row-reverse; }
    .bubble-row.agent { flex-direction: row; }

    /* avatar */
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; flex-shrink: 0; align-self: flex-end;
    }
    .bubble-row.agent .avatar {
      background: linear-gradient(135deg, #1a56db, #1648c0);
      color: #fff;
    }

    /* bubbles */
    .bubble {
      max-width: 72%; padding: 10px 14px; border-radius: 18px;
      line-height: 1.6; font-size: .92rem; word-break: break-word;
    }
    .bubble-row.user .bubble {
      background: #1a56db; color: #fff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .bubble-row.agent .bubble {
      background: #fff; color: #1a1a1a;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }

    /* ── markdown reset inside agent bubbles ─────────────────── */
    .bubble-row.agent .bubble p        { margin: 0 0 .6em; }
    .bubble-row.agent .bubble p:last-child { margin-bottom: 0; }
    .bubble-row.agent .bubble ul,
    .bubble-row.agent .bubble ol       { margin: .4em 0 .6em 1.3em; }
    .bubble-row.agent .bubble li       { margin-bottom: .25em; }
    .bubble-row.agent .bubble li:last-child { margin-bottom: 0; }
    .bubble-row.agent .bubble strong   { font-weight: 600; }
    .bubble-row.agent .bubble em       { font-style: italic; }
    .bubble-row.agent .bubble code {
      background: #f1f5f9; padding: 1px 5px; border-radius: 4px;
      font-family: "SFMono-Regular", Consolas, monospace; font-size: .85em;
    }
    .bubble-row.agent .bubble pre {
      background: #f1f5f9; padding: 10px 12px; border-radius: 8px;
      overflow-x: auto; margin: .5em 0;
    }
    .bubble-row.agent .bubble pre code {
      background: none; padding: 0; font-size: .85em;
    }
    .bubble-row.agent .bubble h1,
    .bubble-row.agent .bubble h2,
    .bubble-row.agent .bubble h3 {
      font-weight: 600; margin: .5em 0 .3em;
    }
    .bubble-row.agent .bubble hr {
      border: none; border-top: 1px solid #e5e7eb; margin: .6em 0;
    }
    .bubble-row.agent .bubble a {
      color: #1a56db; text-decoration: underline;
    }

    /* tool hint */
    .tool-hint {
      font-size: .74rem; color: #9ca3af; font-style: italic;
      margin-top: 5px; padding-left: 38px;
      display: flex; align-items: center; gap: 5px;
    }

    /* ── typing dots ─────────────────────────────────────────── */
    .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 3px 2px; }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%; background: #9ca3af;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-5px); }
    }

    /* ── input row ───────────────────────────────────────────── */
    .input-row {
      display: flex; gap: 8px; align-items: flex-end;
      background: #fff; padding: 8px 10px 8px 14px;
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .input-row textarea {
      flex: 1; resize: none; border: none; outline: none;
      font-size: .92rem; font-family: inherit;
      line-height: 1.5; max-height: 120px;
      background: transparent; color: #1a1a1a;
      padding: 4px 0;
    }
    .input-row textarea::placeholder { color: #9ca3af; }
    .input-row textarea:disabled { opacity: .5; }
    #send-btn {
      width: 38px; height: 38px; padding: 0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <div class="header-icon">🤖</div>
  <div class="header-text">
    <h1>CloudKinetics Support</h1>
    <p>AI-powered customer service</p>
  </div>
  <div class="header-status">
    <span id="status-label">Disconnected</span>
    <span id="status-dot"></span>
  </div>
</header>

<div class="container">

  <div class="conn-bar">
    <label>WSS</label>
    <input id="wss-url" type="text"
      value="wss://nlgriaix5l.execute-api.us-east-1.amazonaws.com/prod"
      placeholder="wss://…" />
    <button id="connect-btn"    class="btn btn-primary" onclick="connect()">Connect</button>
    <button id="disconnect-btn" class="btn btn-danger"  onclick="disconnect()" disabled>Disconnect</button>
  </div>

  <div id="disconnect-banner">Connection lost — reconnect to start a new session.</div>

  <div id="chat"></div>

  <div class="input-row">
    <textarea id="msg-input" rows="1" placeholder="Type a message…" disabled
              onkeydown="handleKey(event)"></textarea>
    <button id="send-btn" class="btn btn-primary" onclick="send()" disabled>➤</button>
  </div>

</div>

<script>
  let ws = null;
  let currentAgentRow  = null;
  let currentBubble    = null;
  let currentToolHint  = null;
  let currentBubbleText = '';

  /* ── connection ──────────────────────────────────────────── */

  function connect() {
    const url = document.getElementById('wss-url').value.trim();
    if (!url) return;

    setStatus('connecting');
    ws = new WebSocket(url);

    ws.onopen = () => {
      setStatus('connected');
      document.getElementById('disconnect-banner').classList.remove('visible');
      document.getElementById('msg-input').disabled = false;
      document.getElementById('send-btn').disabled  = false;
      document.getElementById('connect-btn').disabled    = true;
      document.getElementById('disconnect-btn').disabled = false;
      document.getElementById('msg-input').focus();
    };

    ws.onmessage = (e) => {
      try { handleEvent(JSON.parse(e.data)); }
      catch (_) { /* ignore malformed frames */ }
    };

    ws.onerror = () => setStatus('disconnected');

    ws.onclose = () => {
      setStatus('disconnected');
      document.getElementById('disconnect-banner').classList.add('visible');
      document.getElementById('msg-input').disabled = true;
      document.getElementById('send-btn').disabled  = true;
      document.getElementById('connect-btn').disabled    = false;
      document.getElementById('disconnect-btn').disabled = true;
      finaliseCurrentBubble();
    };
  }

  function disconnect() {
    if (ws) ws.close();
  }

  /* ── sending ─────────────────────────────────────────────── */

  function send() {
    const input = document.getElementById('msg-input');
    const text  = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

    appendUserBubble(text);
    ws.send(JSON.stringify({ message: text }));
    input.value = '';
    input.style.height = '';

    startAgentBubble();
    document.getElementById('send-btn').disabled = true;
    input.disabled = true;
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  /* ── event handling ──────────────────────────────────────── */

  function handleEvent(msg) {
    switch (msg.type) {
      case 'text_delta':    appendTextDelta(msg.text);  break;
      case 'tool_use_start': showToolHint(msg.name);    break;
      case 'end':
        finaliseCurrentBubble();
        document.getElementById('send-btn').disabled = false;
        document.getElementById('msg-input').disabled = false;
        document.getElementById('msg-input').focus();
        break;
    }
  }

  /* ── DOM helpers ─────────────────────────────────────────── */

  function appendUserBubble(text) {
    const row = document.createElement('div');
    row.className = 'bubble-row user';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);
    document.getElementById('chat').appendChild(row);
    scrollToBottom();
  }

  function startAgentBubble() {
    currentAgentRow = document.createElement('div');
    currentAgentRow.className = 'bubble-row agent';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';

    currentBubble = document.createElement('div');
    currentBubble.className = 'bubble';
    currentBubble.innerHTML =
      '<span class="typing-dots"><span></span><span></span><span></span></span>';

    currentAgentRow.appendChild(avatar);
    currentAgentRow.appendChild(currentBubble);
    document.getElementById('chat').appendChild(currentAgentRow);
    scrollToBottom();
    currentToolHint   = null;
    currentBubbleText = '';
  }

  function appendTextDelta(text) {
    if (!currentBubble) startAgentBubble();

    const dots = currentBubble.querySelector('.typing-dots');
    if (dots) dots.remove();

    currentBubbleText += text;
    currentBubble.appendChild(document.createTextNode(text));
    scrollToBottom();
  }

  function showToolHint(toolName) {
    if (!currentAgentRow) return;

    const dots = currentBubble && currentBubble.querySelector('.typing-dots');
    if (dots) dots.remove();

    const label = toolName === 'retrieve_knowledge'
      ? '🔍 Searching knowledge base…'
      : toolName === 'check_order_status'
        ? '🔐 Verifying identity…'
        : `⚙️ Calling ${toolName}…`;

    if (currentToolHint) {
      currentToolHint.textContent = label;
    } else {
      currentToolHint = document.createElement('div');
      currentToolHint.className = 'tool-hint';
      currentToolHint.textContent = label;
      currentAgentRow.appendChild(currentToolHint);
    }
    scrollToBottom();
  }

  function finaliseCurrentBubble() {
    if (currentBubble) {
      const dots = currentBubble.querySelector('.typing-dots');
      if (dots && currentBubble.childNodes.length === 1) {
        dots.remove();
        currentBubble.textContent = '…';
      } else if (currentBubbleText) {
        currentBubble.innerHTML = marked.parse(currentBubbleText);
      }
    }
    if (currentToolHint) {
      currentToolHint.remove();
    }
    currentAgentRow   = null;
    currentBubble     = null;
    currentToolHint   = null;
    currentBubbleText = '';
  }

  function scrollToBottom() {
    const chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;
  }

  /* ── status ──────────────────────────────────────────────── */

  function setStatus(state) {
    document.getElementById('status-dot').className = state;
    document.getElementById('status-label').textContent =
      state.charAt(0).toUpperCase() + state.slice(1);
  }

  // auto-grow textarea
  document.getElementById('msg-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });
</script>
</body>
</html>
