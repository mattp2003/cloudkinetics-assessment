[project]
name = "ck-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that make real AWS calls (deselect with -k 'not integration')",
]

[tool.ruff]
line-length = 100
